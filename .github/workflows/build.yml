name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project TwitterApp.xcodeproj \
            -scheme TwitterApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log || {
              # Surface compiler errors as run annotations (visible without opening logs).
              grep -E "error:" build.log | sort -u | head -15 | while read -r l; do echo "::error::$l"; done
              exit 1
            }

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Twitter.app Payload/
          zip -qr Twitter.ipa Payload
          ls -la Twitter.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Twitter-ipa
          path: Twitter.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: Twitter.ipa
